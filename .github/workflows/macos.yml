name: macOS clients
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      client:
        description: Clients to build
        type: choice
        options: [all, exact]
        default: all
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    if: github.event_name != 'workflow_dispatch' || inputs.client != 'exact'
    name: ${{ matrix.framework }}
    strategy:
      fail-fast: false
      matrix:
        framework: [gpui, rune]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --locked -p git-${{ matrix.framework }}
      - run: cargo test --locked -p rune-git-core
      - if: matrix.framework == 'rune'
        run: cargo test --locked -p git-rune
      - run: |
          python3 tools/package-macos.py "${{ matrix.framework }}"
          python3 tools/make-fixture.py "$RUNNER_TEMP/git-ui-demo"
          python3 tools/smoke-macos.py "$RUNNER_TEMP/git-ui-demo" "${{ matrix.framework }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.framework }}-macos-app
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.framework }}-launch-logs
          path: dist/*.log
          if-no-files-found: ignore
  exact:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXACT_FEEDBACK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check out pinned Exact SDK
        uses: actions/checkout@v4
        with:
          repository: expo/exact
          ref: d5a51c9bb37efeecdd81fa0539adc2fe611d91b6
          path: .deps/exact
          persist-credentials: false
      - name: Restore Exact build and runtime cache
        id: exact-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .deps/exact/target
            apps/exact-client/target
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/hermes-lean-sys
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            ~/.cache/exact/binaryen
            ~/.cache/exact/apple-modules
            ~/.cache/exact/apple-crates
            ~/Library/Caches/ms-playwright
          key: exact-${{ runner.os }}-${{ runner.arch }}-d5a51c9-bun1.4.2-v1-${{ hashFiles('tools/setup-exact.sh', 'tools/patch-exact.py', 'apps/exact-client/**') }}
          restore-keys: |
            exact-${{ runner.os }}-${{ runner.arch }}-d5a51c9-bun1.4.2-v1-
      - run: ./tools/setup-exact.sh
        id: setup
      - run: bun test apps/exact-client/git.test.ts
      - run: ./tools/exact.sh contract build app.contract --json --errors-only
      - name: Build native Exact bundle
        run: bun tools/build-exact-macos.mjs
      - name: Test native Exact screen
        run: ./tools/exact.sh test macos
      - name: Test native Git interactions
        run: |
          python3 tools/make-fixture.py "$RUNNER_TEMP/exact-git-demo"
          bun tools/exact-native-smoke.ts "$RUNNER_TEMP/exact-git-demo"
      - name: Package Exact bundle
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          bundles = list(Path('.').glob('**/clients/*/dev.runechat.git.exact/macos/*.app'))
          if len(bundles) != 1:
              raise SystemExit(f'Expected one Exact bundle, found {bundles}')
          subprocess.run(['python3', 'tools/package-macos.py', 'exact', '--exact-app', str(bundles[0])], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-macos-app
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
      # Retain a successful SDK setup even when a later native check fails.
      - name: Save Exact build and runtime cache
        if: always() && !cancelled() && steps.setup.conclusion == 'success' && steps.exact-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .deps/exact/target
            apps/exact-client/target
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/hermes-lean-sys
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            ~/.cache/exact/binaryen
            ~/.cache/exact/apple-modules
            ~/.cache/exact/apple-crates
            ~/Library/Caches/ms-playwright
          key: ${{ steps.exact-cache.outputs.cache-primary-key }}
  release:
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [rust, exact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find successful app artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          count=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name | test("-macos-apps?$"))] | length')
          if [ "$count" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.artifacts.outputs.available == 'true'
        with:
          pattern: '*-macos-app*'
          path: downloads
          merge-multiple: true
      - name: Publish downloadable preview
        if: steps.artifacts.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: macos-preview-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cd downloads
          sha256sum *.dmg *.zip > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          Native macOS development previews. Open the DMG and drag the app to Applications.
          ZIP archives containing the same standalone .app are also included. Choose the download matching your Mac's architecture.

          These builds are ad-hoc signed, not Apple Developer ID signed or notarized. macOS may require approval in System Settings > Privacy & Security when first opened.

          Only successful app builds are attached; a failed framework does not block the others. Attached Rust apps passed Git tests and a packaged-process startup check on the macOS runner. An attached Exact build passed its initial-screen native test before packaging. These checks do not replace manual interaction testing on your Mac.

          Git must be installed (Apple's Command Line Tools provide it). Minimum intended system: macOS 14; inspect the Exact bundle's Info.plist for its SDK-selected minimum. Preview builds are not optimized release builds.
          EOF
          gh release create "$RELEASE_TAG" *.dmg *.zip SHA256SUMS.txt --target "$RELEASE_COMMIT" --prerelease --title "Arbor macOS preview" --notes-file release-notes.md
